name: CS Launcher V2 CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── LTW (CS Launcher fork) ──────────────────────────────────────────────
      # NOTE: Replace the URL below with your own LTW fork once you have one.
      #       The original CopperLauncher/LTW repo has been removed per requirement 1.
      - name: Download LTW
        run: |
          sudo apt-get update -qq && sudo apt-get install -y wget
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget -q "${{ secrets.LTW_RELEASE_URL || 'https://github.com/YOUR_ORG/LTW/releases/latest/download/ltw-release.aar' }}" \
               -O ltw-release.aar
        # ↑ Set LTW_RELEASE_URL in repo secrets, or hard-code your fork URL above.

      # ── JRE 8 Runtime ───────────────────────────────────────────────────────
      - name: Download JRE 8
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # ── Gradle ──────────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ── Signing keystore ─────────────────────────────────────────────────────
      # Secrets required (add in GitHub → Settings → Secrets):
      #   SIGNING_KEYSTORE_BASE64  — base64-encoded .jks file
      #   SIGNING_KEY_ALIAS        — key alias
      #   SIGNING_KEY_PASSWORD     — key password
      #   SIGNING_STORE_PASSWORD   — store password
      - name: Decode signing keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/keystore.jks" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"         >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}"   >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV

      # ── Language list ────────────────────────────────────────────────────────
      - name: Update language list
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      # ── Release APK (PRIMARY — signed, shrunk) ───────────────────────────────
      - name: Build Release APK
        run: |
          SIGNING_ARGS=""
          if [ -n "$KEYSTORE_PATH" ]; then
            SIGNING_ARGS="-PsigningKeystore=$KEYSTORE_PATH \
                          -PsigningKeyAlias=$KEY_ALIAS \
                          -PsigningKeyPassword=$KEY_PASSWORD \
                          -PsigningStorePassword=$STORE_PASSWORD"
          fi
          ./gradlew :app_pojavlauncher:assembleRelease $SIGNING_ARGS \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon \
            --stacktrace

          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" out/CS-LAUNCHER-V2.apk
            md5sum  out/CS-LAUNCHER-V2.apk > out/CS-LAUNCHER-V2.md5
            sha256sum out/CS-LAUNCHER-V2.apk > out/CS-LAUNCHER-V2.sha256
          else
            echo "ERROR: Release APK not found" && exit 1
          fi

      # ── Debug APK (internal / QA only) ───────────────────────────────────────
      - name: Build Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug \
            --no-daemon

          DEBUG_APK=$(find app_pojavlauncher/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" out/CS-LAUNCHER-V2-DEBUG.apk
            md5sum out/CS-LAUNCHER-V2-DEBUG.apk > out/CS-LAUNCHER-V2-DEBUG.md5
          fi

      # ── No-runtime APK ───────────────────────────────────────────────────────
      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          rm -rf app_pojavlauncher/src/main/assets/components/jre-25

          ./gradlew :app_pojavlauncher:assembleRelease \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon

          NORUNTIME_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$NORUNTIME_APK" ]; then
            cp "$NORUNTIME_APK" out/CS-LAUNCHER-V2-NO-RUNTIME.apk
            md5sum    out/CS-LAUNCHER-V2-NO-RUNTIME.apk > out/CS-LAUNCHER-V2-NO-RUNTIME.md5
            sha256sum out/CS-LAUNCHER-V2-NO-RUNTIME.apk > out/CS-LAUNCHER-V2-NO-RUNTIME.sha256
          fi

      # ── APK size report ──────────────────────────────────────────────────────
      - name: APK size report
        run: |
          echo "## APK Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in out/*.apk; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "| $(basename $f) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done

      # ── Upload all artifacts ─────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs-launcher-v2-build-${{ github.run_number }}
          path: out/*
          retention-days: 30
