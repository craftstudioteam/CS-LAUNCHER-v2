name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt update && sudo apt install -y wget
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget https://github.com/CopperLauncher/LTW/releases/latest/download/ltw-release.aar
      
      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Release .apk
        run: |
          gradle :app_pojavlauncher:assembleRelease
          RELEASE_APK=$(find app_pojavlauncher/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" out/CS-LAUNCHER-V2.apk
            md5sum out/CS-LAUNCHER-V2.apk > out/CS-LAUNCHER-V2.md5
          fi

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          DEBUG_APK=$(find app_pojavlauncher/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" out/CS-LAUNCHER-V2-DEBUG.apk
            md5sum out/CS-LAUNCHER-V2-DEBUG.apk > out/CS-LAUNCHER-V2-DEBUG.md5
          fi

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          rm -rf app_pojavlauncher/src/main/assets/components/jre-25
          ./gradlew assembleDebug
          NORUNTIME_APK=$(find app_pojavlauncher/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$NORUNTIME_APK" ]; then
            cp "$NORUNTIME_APK" out/CS-LAUNCHER-V2-NO-RUNTIME.apk
            md5sum out/CS-LAUNCHER-V2-NO-RUNTIME.apk > out/CS-LAUNCHER-V2-NO-RUNTIME.md5
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs-launcher-artifacts
          path: out/*

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push'
        with:
          artifacts: "out/*.apk,out/*.md5"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ github.run_number }}-${{ github.sha }}"
          name: "CS Launcher V2 Build #${{ github.run_number }}"
          body: |
            Automated build of CS Launcher V2.
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          allowUpdates: true
          omitBodyDuringUpdate: false
          replacesArtifacts: true
